name: Build game downloads

# Push a tag like v1.0.0 to build Windows and Linux downloads and publish them on the Releases page.
# Pull requests and "Run workflow" (manual) build the same files as downloadable artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: AstroPlay-Windows.zip
          - os: ubuntu-22.04          # older glibc, so the Linux build runs on more distributions
            archive: AstroPlay-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # Panda3D 1.10.16 has no build for Python 3.14
          cache: pip

      - name: Install dependencies (without ChromaDB)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^\s*(#|$)|chromadb' requirements.txt | sed 's/#.*//' > req-build.txt
          python -m pip install -r req-build.txt pyinstaller

      - name: Run tests
        shell: bash
        run: python -m pytest --ignore=tests/test_outpost_ui.py -q

      - name: Build
        run: pyinstaller packaging/astro_play.spec --noconfirm

      - name: Add player notes
        shell: bash
        run: cp packaging/PLAYER_README.txt dist/AstroPlay/README.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/AstroPlay -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} AstroPlay

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
